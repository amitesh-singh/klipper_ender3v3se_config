##
## input shaping with mpu-6050, which are i2c based 
##
##

# The below config is for mpu-6050, which worked fine after a fix in klipper fw
#[include input_shaping_calibration.cfg]
# the below config is for adxl345
#[include adxl.cfg]

# how to test the setup
# # do it a few times, as sometimes chip does not reply
# ACCELEROMETER_QUERY CHIP=adxl345

[input_shaper]
shaper_type: ei
shaper_freq_x: 63.6 # calculated using mpu-6050
#shaper_freq_y: 50 # default value copied from ender 3v3 se marlin code
shaper_freq_y: 37.6 # calculated with adxl345
damping_ratio_x: 0.15 # default value copied from ender 3v3 se marlin code
damping_ratio_y: 0.15 #default value copied from ender 3v3 se marlin code
