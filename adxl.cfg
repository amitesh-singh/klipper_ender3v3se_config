[mcu bluepill]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_B55B5A1A000000007A9EEE01-if00
# Edit the above line with the correct serial address. Use "ls /dev/serial/by-id/*" to find the MCU serial address.
#serial: /dev/ttyACM0

#
# i2c support for adxl345 is not present in klipper 
#ADXL345 pin	Bluepill pin
# VCC	3.3V
# GND	GND
# SCL/SCLK	PA5 (SPI1 SCK)
# SDA/MOSI	PA7 (SPI1 MOSI)
# SDO/MISO	PA6 (SPI1 MISO)
# CS	PA4 (SPI1 NSS) or any free GPIO
#


# How to test if it works
# run this command for like 4-5 times at least
# ACCELEROMETER_QUERY
# ACCELEROMETER_QUERY CHIP=adxl345
# 
#
# TEST_RESONANCES AXIS=X
# TEST_RESONANCES AXIS=Y
#
[adxl345]
cs_pin: bluepill:PA4
spi_bus: spi1


[resonance_tester]
accel_chip: adxl345
#accel_per_hz: 70
probe_points:
    117.5,117.5,10 # choose the mid point of 235x235mm bed

[gcode_macro INPUTSHAPER_X]
gcode:
  M84
  G90
  G28
  SHAPER_CALIBRATE AXIS=x
  SAVE_CONFIG 

[gcode_macro INPUTSHAPER_Y]
gcode:
  M84
  G90
  G28
  SHAPER_CALIBRATE AXIS=y
  SAVE_CONFIG 
